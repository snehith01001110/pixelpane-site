<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pixel Pane">
  <!-- Aurora field with a dark navy orb. The orb is a radial from a lit core
       to a near-black rim, not a flat fill — the reference samples
       rgb(35,45,91) dead centre against rgb(13,17,34) at the edge, and a flat
       disc reads noticeably deader. Sized larger than the reference's crop,
       which frames a poster; an icon has to carry to the tile edge. -->
  <defs>
    <clipPath id="pp-tile-clip"><rect width="64" height="64" rx="14"/></clipPath>
    <radialGradient id="pp-a1" cx="14%" cy="16%" r="62%">
      <stop offset="0" stop-color="#4f8ce6" stop-opacity="1"/><stop offset="1" stop-color="#4f8ce6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pp-a2" cx="72%" cy="6%" r="58%">
      <stop offset="0" stop-color="#f0a95e" stop-opacity="1"/><stop offset="1" stop-color="#f0a95e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pp-a3" cx="86%" cy="30%" r="40%">
      <stop offset="0" stop-color="#c6dc55" stop-opacity=".92"/><stop offset="1" stop-color="#c6dc55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pp-a4" cx="97%" cy="52%" r="42%">
      <stop offset="0" stop-color="#ef7a5c" stop-opacity=".95"/><stop offset="1" stop-color="#ef7a5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pp-a5" cx="44%" cy="98%" r="62%">
      <stop offset="0" stop-color="#4a86e0" stop-opacity="1"/><stop offset="1" stop-color="#4a86e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pp-a6" cx="8%" cy="74%" r="50%">
      <stop offset="0" stop-color="#e79ed0" stop-opacity=".95"/><stop offset="1" stop-color="#e79ed0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pp-a7" cx="4%" cy="46%" r="42%">
      <stop offset="0" stop-color="#9182dd" stop-opacity=".92"/><stop offset="1" stop-color="#9182dd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pp-a8" cx="90%" cy="90%" r="46%">
      <stop offset="0" stop-color="#f2ad7e" stop-opacity=".88"/><stop offset="1" stop-color="#f2ad7e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pp-orb" cx="50%" cy="45%" r="64%">
      <stop offset="0" stop-color="#2a3768"/>
      <stop offset="0.5" stop-color="#1a2245"/>
      <stop offset="1" stop-color="#0b0e1d"/>
    </radialGradient>
    <filter id="pp-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="pp-orb-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <g clip-path="url(#pp-tile-clip)">
    <rect width="64" height="64" fill="#171a2e"/>
    <rect width="64" height="64" fill="url(#pp-a1)"/>
    <rect width="64" height="64" fill="url(#pp-a2)"/>
    <rect width="64" height="64" fill="url(#pp-a3)"/>
    <rect width="64" height="64" fill="url(#pp-a4)"/>
    <rect width="64" height="64" fill="url(#pp-a5)"/>
    <rect width="64" height="64" fill="url(#pp-a6)"/>
    <rect width="64" height="64" fill="url(#pp-a7)"/>
    <rect width="64" height="64" fill="url(#pp-a8)"/>
    <rect width="64" height="64" filter="url(#pp-grain)" opacity=".14"/>
    <circle cx="33" cy="33.4" r="14" fill="#05060d" opacity=".5" filter="url(#pp-orb-shadow)"/>
    <circle cx="32" cy="32" r="14" fill="url(#pp-orb)"/>
  </g>
</svg>
