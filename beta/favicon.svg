<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pixel Pane beta">
  <!-- The reference field as sent — light. Production runs the dark-mode
       inversion of the same artwork, so at 16px the two tabs read as a pale
       tile and a dark one, which is the fastest thing to tell apart in a
       crowded tab strip. Same orb in both. -->
  <defs>
    <clipPath id="pp-bfav-clip"><rect width="64" height="64" rx="14"/></clipPath>
    <radialGradient id="pp-bfa1" cx="14%" cy="16%" r="62%">
      <stop offset="0" stop-color="#4f8ce6" stop-opacity="1"/><stop offset="1" stop-color="#4f8ce6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pp-bfa2" cx="72%" cy="6%" r="58%">
      <stop offset="0" stop-color="#f0a95e" stop-opacity="1"/><stop offset="1" stop-color="#f0a95e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pp-bfa3" cx="86%" cy="30%" r="40%">
      <stop offset="0" stop-color="#c6dc55" stop-opacity=".92"/><stop offset="1" stop-color="#c6dc55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pp-bfa4" cx="97%" cy="52%" r="42%">
      <stop offset="0" stop-color="#ef7a5c" stop-opacity=".95"/><stop offset="1" stop-color="#ef7a5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pp-bfa5" cx="44%" cy="98%" r="62%">
      <stop offset="0" stop-color="#4a86e0" stop-opacity="1"/><stop offset="1" stop-color="#4a86e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pp-bfa6" cx="8%" cy="74%" r="50%">
      <stop offset="0" stop-color="#e79ed0" stop-opacity=".95"/><stop offset="1" stop-color="#e79ed0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pp-bfa7" cx="4%" cy="46%" r="42%">
      <stop offset="0" stop-color="#9182dd" stop-opacity=".92"/><stop offset="1" stop-color="#9182dd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pp-bfa8" cx="90%" cy="90%" r="46%">
      <stop offset="0" stop-color="#f2ad7e" stop-opacity=".88"/><stop offset="1" stop-color="#f2ad7e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pp-bforb" cx="50%" cy="45%" r="64%">
      <stop offset="0" stop-color="#2a3768"/>
      <stop offset="0.5" stop-color="#1a2245"/>
      <stop offset="1" stop-color="#0b0e1d"/>
    </radialGradient>
    <filter id="pp-bforb-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <g clip-path="url(#pp-bfav-clip)">
    <rect width="64" height="64" fill="#fdf6ec"/>
    <rect width="64" height="64" fill="url(#pp-bfa1)"/>
    <rect width="64" height="64" fill="url(#pp-bfa2)"/>
    <rect width="64" height="64" fill="url(#pp-bfa3)"/>
    <rect width="64" height="64" fill="url(#pp-bfa4)"/>
    <rect width="64" height="64" fill="url(#pp-bfa5)"/>
    <rect width="64" height="64" fill="url(#pp-bfa6)"/>
    <rect width="64" height="64" fill="url(#pp-bfa7)"/>
    <rect width="64" height="64" fill="url(#pp-bfa8)"/>
    <circle cx="33" cy="33.4" r="15" fill="#05060d" opacity=".5" filter="url(#pp-bforb-shadow)"/>
    <circle cx="32" cy="32" r="15" fill="url(#pp-bforb)"/>
  </g>
</svg>
